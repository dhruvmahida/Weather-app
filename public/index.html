<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>🌤️ Weather App</h1>
    <p class="subtitle">Check the weather of any city</p>

    <!-- search bar -->
    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter a city name (e.g. Surat)">
      <button id="searchBtn">Search</button>
    </div>

    <!-- error or loading message -->
    <p id="message"></p>

    <!-- current weather -->
    <div id="result"></div>

    <!-- 5 day forecast -->
    <div id="forecast"></div>

    <!-- recent searches -->
    <h3 class="heading">Recent searches</h3>
    <div id="history"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
